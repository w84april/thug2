  const status = document.querySelector('#status');
  const report = document.querySelector('#report');
  // A terminated worker releases each suite's large fixtures and Wasm memory.
  function runSuite(suite, wasm) {
    return new Promise((resolve, reject) => {
      const worker = new Worker('./validation-worker.mjs', { type: 'module' });
      worker.onmessage = ({ data }) => {
        worker.terminate();
        if (data.error) reject(new Error(data.error));
        else resolve(data.result);
      };
      worker.onerror = event => {
        worker.terminate();
        reject(new Error(event.message || 'Validation worker failed'));
      };
      worker.postMessage({ suite, wasm });
    });
  }
  try {
    const response = await fetch('thug-core.wasm');
    if (!response.ok) throw new Error('thug-core.wasm: HTTP ' + response.status);
    const wasm = new Uint8Array(await response.arrayBuffer());
    const result = {};
    for (const [index, suite] of suites.entries()) {
      status.textContent = `Running ${index + 1}/${suites.length}: ${suite[0] || 'collision'}…`;
      const checked = await runSuite(suite, wasm);
      if (suite[0] === null) Object.assign(result, checked);
      else result[suite[0]] = checked;
    }
    result.browser = navigator.userAgent;
    result.wasm_sha256 = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', wasm)),
      b => b.toString(16).padStart(2, '0')).join('');
    status.textContent = 'PASS — checks completed; see scope and documented oracle differences below.';
    report.textContent = JSON.stringify(result, null, 2);
  } catch (error) {
    status.textContent = 'FAIL';
    report.textContent = error.stack;
